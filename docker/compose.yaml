services:
  trustdeck-kafka-connector:
    # Named after the Compose project, so instances started with different CONNECTOR_PROJECT values do not collide
    container_name: ${COMPOSE_PROJECT_NAME:-trustdeck-kafka-connector}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # Proxy for Maven and apt during the build, taken from the calling shell; empty without a proxy
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    image: trustdeck-kafka-connector:1.0.0
    restart: unless-stopped
    stop_grace_period: 45s
    env_file:
      # connector.sh sets CONNECTOR_ENV_FILE to the instance's environment file
      - path: ${CONNECTOR_ENV_FILE:-../.env}
        required: false
    environment:
      TZ: UTC
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/app/config/
    volumes:
      - ../config/instance/application.yaml:/app/config/application.yaml:ro
      - ../config/instance/truststores:/app/truststores:ro
      # Statistics survive container recreation; the directory must be writable by UID 10001 (connector.sh prepares it)
      - ${STATISTICS_HOST_DIR:-../statistics}:/app/statistics
    ports:
      - "${HEALTH_HOST_PORT:-18080}:8080"
